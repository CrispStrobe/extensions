name: Validate

on:
  pull_request:

jobs:
  validate:
    # The name carries the status, because a non-blocking job still shows a
    # red tick — `continue-on-error` stops it failing the RUN, not the check.
    # ci.yml's copy solved that by saying so in the name; this says so too.
    name: Validate (informational — duplicate of ci.yml's)
    runs-on: ubuntu-latest
    # NON-BLOCKING, for the same reason ci.yml's "Gallery validate
    # (informational)" job already is — this is the inherited TurboWarp copy
    # that was left blocking beside it. It runs the identical command on the
    # identical trigger, so it reports nothing ci.yml does not; it is left in
    # place rather than deleted because this file is TurboWarp's, and thinning
    # it is a divergence to take deliberately and not in passing.
    #
    # Every CrispStrobe extension fails one rule: the `// By:` header links a
    # GitHub profile and the validator requires a Scratch one. That is not a
    # defect to fix but a difference of context — this gallery's extensions
    # are authored on GitHub, and the link is correct. It fires on all 21
    # files regardless of what a PR touches, so left blocking it makes every
    # pull request red on arrival, which teaches reviewers to stop reading
    # the checks. The count still shows in the run summary.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check format
        shell: bash
        run: |
          # Rewrite the prettier output format into the GitHub Actions annotation format
          # This is a hack, but this is easier than reimplementing the prettier CLI's ignore
          # rules ourselves.
          NO_COLOR=1 npm run check-format 2> >(tee >( \
            grep -v 'Run Prettier with --write to fix' | \
            sed -e 's/^\[warn] \(.*\)$/::warning file=\1,line=1::File was not formatted with prettier. Usually, commenting !format will fix this./' \
          ))

  type-warnings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate type warnings
        run: node development/ci-generate-type-warnings.js
        env:
          PR_NUMBER: "${{ github.event.number }}"
          GH_REPO: "${{ github.repository }}"
